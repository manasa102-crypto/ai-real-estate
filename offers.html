<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>العروض الحصرية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f5f7; padding: 20px; text-align: right; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-right: 4px solid #e60000; }
        h2 { color: #e60000; margin-bottom: 20px; text-align: center; }
        .back-btn { display: block; text-align: center; margin-top: 20px; color: #555; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🔥 العروض والخصومات العقارية</h2>
    <div class="card">
        <h3>خصم 10% على الدفع الكاش</h3>
        <p>متاح على جميع الوحدات السكنية في العاصمة الإدارية الجديدة ونظم التجمع الخامس.</p>
    </div>
    <div class="card">
        <h3>بدون مقدم وتقسيط على 8 سنوات</h3>
        <p>عرض لفترة محدودة بالتعاون مع كبرى الشركات الهندسية.</p>
    </div>
    <a href="/" class="back-btn">← العودة للرئيسية</a>
</body>
</html>
