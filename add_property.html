<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة عقار ذكي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #f0f2f5; padding: 20px; padding-bottom: 50px; }
        .form-container { background: white; max-width: 500px; margin: 0 auto; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 5px solid #6366f1; }
        h2 { color: #1e293b; margin-bottom: 20px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #475569; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; transition: all 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
        .ai-box { background: #e0e7ff; padding: 12px; border-radius: 10px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; border: 1px dashed #6366f1; }
        .ai-box label { color: #3730a3; margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 14px; }
        .ai-box input { width: 20px; height: 20px; cursor: pointer; }
        .btn-submit { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3); }
        .btn-submit:hover { opacity: 0.95; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>✨ إضافة عقار بالذكاء الاصطناعي</h2>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>عنوان العقار:</label>
                <input type="text" name="title" placeholder="مثلاً: شقة راقية في وسط المدينة" required>
            </div>

            <div class="form-group">
                <label>نوع العقار:</label>
                <select name="type">
                    <option value="شقة">شقة</option>
                    <option value="فيلا">فيلا</option>
                    <option value="دوبلكس">دوبلكس</option>
                    <option value="توين هاوس">توين هاوس</option>
                    <option value="بنت هاوس">بنت هاوس</option>
                    <option value="محل تجاري">محل تجاري</option>
                    <option value="مكتب إداري">مكتب إداري</option>
                </select>
            </div>

            <div class="form-group">
                <label>الموقع (المنطقة / المدنية):</label>
                <input type="text" name="location" placeholder="مثلاً: التجمع الخامس، دبي" required>
            </div>

            <div class="form-group">
                <label>سعر البيع (جنيه / دولار):</label>
                <input type="number" name="price" placeholder="مثلاً: 5000000">
            </div>

            <div class="form-group">
                <label>سعر الإيجار الشهري (إن وجد):</label>
                <input type="number" name="rent" placeholder="مثلاً: 25000">
            </div>

            <div class="form-group">
                <label>المساحة (بالمتر المربع):</label>
                <input type="number" name="area" placeholder="مثلاً: 200" required>
            </div>

            <!-- ميزة الذكاء الاصطناعي الخارقة -->
            <div class="ai-box">
                <label for="ai_boost">
                    <span>🤖</span> توليد ووصف إعلاني احترافي بالذكاء الاصطناعي
                </label>
                <input type="checkbox" id="ai_boost" name="ai_boost" checked>
            </div>

            <div class="form-group">
                <label>أو اكتب وصفاً إضافياً (اختياري):</label>
                <textarea name="description" rows="3" placeholder="اتركه فارغاً وسيقوم الذكاء الاصطناعي بكتابة الوصف بالكامل..."></textarea>
            </div>

            <div class="form-group">
                <label>صورة العقار:</label>
                <input type="file" name="image" accept="image/*">
            </div>

            <button type="submit" class="btn-submit">نشر العقار بالذكاء الاصطناعي 🚀</button>
        </form>

        <a href="/" class="back-link">← العودة للرئيسية</a>
    </div>

</body>
</html>
